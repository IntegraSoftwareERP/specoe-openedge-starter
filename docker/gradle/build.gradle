// gradle/build.gradle — placeholder para build del webapp PASOE.
// El cliente customiza esto con los paths de su instalacion OpenEdge.
//
// TKT-0309 — ESTE archivo es el unico consumidor de `pasoe.instance-name` en todo el starter, y
// `database.logical-name` no tiene ninguno (las skills del backend lo renderizan server-side
// desde el yaml del TENANT en el skill-server, que es otro archivo). Por eso el check de config
// de setup.sh dejo de exigir los dos cuando la carpeta es un room SDD: `docker/` ni llega al
// clon de un room (specoe-add-room.sh lo recorta en SPECOE_ROOM_DROP), asi que ningun room los
// consume. Para el proyecto ERP siguen obligatorios y setup.sh los exige igual que antes.
//
// La salvedad que TKT-0309 dejo anotada y sin resolver —el valor de template de
// `pasoe.instance-name` era `oepas1`, que tambien es un valor real plausible, asi que el dev del
// proyecto ERP que lo dejaba porque le servia seguia contando como "sin editar"— la cierra
// TKT-0307: los cinco campos que el gate exige valen `CAMBIAR-ME` en el template, que nadie puede
// querer de verdad. El valor de ejemplo quedo en el comentario inline del yaml.

plugins {
    id 'base'
}

ext {
    projectName = '{{project.name}}'
    projectVendor = '{{project.vendor}}'
    pasoeInstance = '{{pasoe.instance-name}}'
    pasoeWebapp = '{{pasoe.webapp}}'
}

task info {
    doLast {
        println "SpecOE starter build — $projectName ($projectVendor)"
        println "PASOE instance: $pasoeInstance / webapp: $pasoeWebapp"
        println ""
        println "Este build.gradle es un placeholder. Customizar con:"
        println "  - classpath de \$DLC/java/ade-*.jar"
        println "  - paths del codigo ABL del cliente"
        println "  - paso de compile (ABL -> .r)"
        println "  - paso de empaquetado (.war/.pasoear)"
    }
}

defaultTasks 'info'
