# SpecOE project config — template inicial.
#
# Este archivo debe pasar la validacion de @specoe/config-tools:
#     npx specoe-validate project.config.yaml
#
# Cada campo está documentado inline más abajo.

schema-version: '0.1.0'

# ============================================================================
# TIER 1 — OBLIGATORIO
# ============================================================================

# TKT-0307 — los campos que el instalador EXIGE editar valen 'CAMBIAR-ME', no un valor plausible:
# el gate de config de setup.sh corta mientras sigan asi, y una sentinela que nadie puede querer de
# verdad evita el caso de `pasoe.instance-name: 'oepas1'`, que era a la vez valor de template y
# valor real posible. Los demas campos SI traen defaults razonables a proposito: no los exige nadie.
project:
  name: 'CAMBIAR-ME' # Nombre comercial del proyecto (ej. 'ACME ERP') — OBLIGATORIO editar
  vendor: 'CAMBIAR-ME' # Empresa cliente, razon social (ej. 'ACME SA') — OBLIGATORIO editar
  email: 'contacto@micliente.com' # Email de contacto del proyecto (formato valido)
  locale: 'es-AR' # ICU locale (ej. es-AR, en-US, pt-BR)
  currency: 'ARS' # ISO 4217 de 3 letras (ej. ARS, USD, EUR)

paths:
  workspace-root: 'CAMBIAR-ME' # Path absoluto al workspace del cliente (ej. 'C:/ACME/VSCode') — OBLIGATORIO editar
  repos: # Nombres de carpetas de cada repo
    webservices: 'Webservices' # Clases ABL + PASOE content (obligatorio)
    data: 'Integra.Data' # Temp-tables + datasets (obligatorio)
    tests: 'Integra.Test' # ABLUnit tests (obligatorio)
    framework: 'Integra.FrameWork' # Framework base (opcional)
    business: 'Integra.Business' # Logica de negocio extendida (opcional)
    common: 'Integra.Common' # Utilidades compartidas (opcional)
    helpers: 'Integra.Helpers' # Helpers del cliente (opcional)
  source-root: 'AppServer/' # Raiz del codigo ABL dentro de Webservices
  data-root: 'Data/' # Raiz de tt/ds defs dentro de Integra.Data
  test-root: 'tests/' # Raiz de tests dentro de Integra.Test

database:
  logical-name: 'CAMBIAR-ME' # Nombre logico de la DB Progress (ej. 'acmedb') — OBLIGATORIO en el proyecto ERP; un room SDD no lo usa (TKT-0309)
  broker-port: 49000 # Puerto del broker (1024-65535, unico)
  multi-tenant-field: 'Empresa' # Campo de tenant en todas las tablas (framework Integra)
  collation:
    cpinternal: 'ISO8859-15' # Codepage interno de la DB
    cpstream: 'ISO8859-15' # Codepage de stream I/O
    cpcase: 'basic' # Case table
    cpcoll: 'basic' # Collation table
    numsep: 46 # ASCII de separador de miles ('.')
    numdec: 44 # ASCII de separador decimal (',')
  env-user: 'DB_USER' # Nombre de ENV var que tiene el usuario DB
  env-password: 'DB_PASSWORD' # Nombre de ENV var que tiene el password DB

pasoe:
  oe-version: '12.8' # Version OpenEdge major.minor
  instance-name: 'CAMBIAR-ME' # Instancia PASOE (ej. 'oepas1') — OBLIGATORIO en el proyecto ERP; un room SDD no lo usa (TKT-0309)
  working-dir: 'C:/OpenEdge/WRK/oepas1' # Working directory de PASOE
  webapp: 'ClienteWeb' # WebApp registrada en PASOE
  rest-transport: '/WebServices/rest/IntegraERP' # Path del REST transport (debe empezar con /)
  ports:
    dev-http: 8810 # HTTP local dev (distinto de dev-https)
    dev-https: 8811 # HTTPS local dev
    test-https: 8820 # HTTPS entorno test
    prod-https: 8830 # HTTPS produccion
  openedge-home: 'C:/Progress/OpenEdge' # Path de OpenEdge install (opcional, usa $DLC si vacio)
  pasoe-home: 'C:/Progress/OpenEdge/servers' # Path de PASOE servers (opcional)

git:
  main-branch: 'main' # Branch principal del repo
  feature-branch-template: 'feat/{ticket-number}-{slug}' # Debe contener {ticket-number}
  commit-style: 'conventional' # conventional | custom
  repo-url-template: 'https://github.com/MiCliente/{repo}' # (opcional) para links automaticos

# ============================================================================
# TIER 2 — RECOMENDADO (con defaults)
# ============================================================================

conventions:
  entity-prefix: '' # Prefijo de clases entity (ej. "E" -> EClient.cls). Default: ""
  temp-table-prefix: 'tt' # Default: "tt"
  dataset-prefix: 'ds' # Default: "ds"
  include-path-template: 'Data/Clases/Entitys/{area}/{class}.i' # Default: este mismo template
  code-charset: 'ascii' # ascii | utf-8. Default: ascii
  field-names: 'full' # full | abbreviated. Default: full
  table-name-prefix-in-code: false # true/false. Default: false

areas: # Array de objetos (no objeto!)
  - name: 'clienteapp'
    description: 'Area de storage para tablas de aplicacion'
  - name: 'clienteidx'
    description: 'Area para indices'
  - name: 'cliente_blob'
    description: 'Area para BLOBs y adjuntos del Hub'

hub:
  api-url: 'https://hub.integra.local/api/v1'
  auth:
    method: 'env' # env | oauth | static. 'static' NO recomendado (warning).
    env-user: 'INTEGRA_HUB_EMAIL' # Requerido si method=env
    env-password: 'INTEGRA_HUB_PASSWORD' # Requerido si method=env

# SPECOE — thin-client servido. Rol SDD de ESTA carpeta/room.
# Multi-rol: un dev usa varios roles a la vez, uno por carpeta — cada carpeta
# declara SU rol acá. El SessionStart hook lo lee para resolver la licencia del
# rol en el keyring (account = rol) y cachear su JWT por-carpeta. Vacío = modo
# 1-rol legacy (licencia en el keyring account 'default').
#
# `work-repo` (TKT-0317) es el repo donde vive el CÓDIGO sobre el que trabaja este
# room. ESTA carpeta no lo es: es un clon shallow del starter, y las herramientas
# de aislamiento del agente operan sobre el cwd — sin esta declaración apuntan al
# repo equivocado. Path absoluto al checkout local (no una URL). Lo fija
# `specoe-add-room.sh --work-repo <ruta>` y lo exporta el launcher como
# INTEGRA_SDD_WORK_REPO. Vacío = room que no toca código.
specoe:
  role: '' # DISCOVERY | ENGINEERING | ADVERSARIAL | CC_DEV
  work-repo: '' # Ruta absoluta al repo del código (ej. C:/Integra/VSCode/Webservices)

frontend:
  enabled: false # true si el cliente tiene frontend React
  # stack:                                # OBLIGATORIO si enabled=true
  #   framework: "React"
  #   version: "18.3.1"
  #   build-tool: "Vite"
  #   build-tool-version: "6.0.0"
  #   language: "typescript"
  #   http-client: "axios"
  #   router: "react-router-dom"
  #   router-version: "7.1.0"
  #   charts: "recharts"

# engram-central: opcional. Descomentar SOLO si el equipo tiene Gitea + sync montado.
# engram-central:
#   gitea-url: "https://gitea.team.local"           # URL completa
#   gitea-ssh: "git@gitea.team.local"               # Formato git@host
#   gitea-org: "micliente"                          # Organizacion en Gitea
#   sync-interval-minutes: 10                       # 1-1440. Default: 10
#   local-path: "~/engram-central"                  # Default: ~/engram-central
#   include-sessions: true                          # Default: true
#   include-prompts: false                          # Default: false
#   secret-scan: true                               # Default: true

# ============================================================================
# TIER 3 — INTENCIONALMENTE OMITIDO DE ESTE TEMPLATE
# ============================================================================
#
# La seccion `framework:` (Tier 3) contiene los literales "locked" del patron
# SpecOE: naming de base classes, datasets, metodos de sesion, prefijos de
# codigos de estado, servicios de auth. Esos valores son IP del producto.
#
# El Skill Server de SpecOE hace el merge de Tier 3 server-side cuando tu
# `project.config.yaml` (Tier 1 + 2 del cliente) se envia al Hub como parte
# del flujo de generacion de skills / commands / agents. No necesitas
# declararlo ni saber su contenido — SpecOE lo aplica automaticamente.
#
# Si intentas declarar `framework:` local aca, el validator client-side
# (@specoe/config-tools, Tier 1 only) ignora la seccion con una notice
# informativa. La validacion completa Tier 1+2+3 corre server-side.
#
# Nota: Tier 2/3 se validan server-side — el cliente no necesita conocer su estructura.
